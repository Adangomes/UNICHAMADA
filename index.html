<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UniChamada — Apresentação</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef0ff;--fg:#0e1450;--mut:#4a5090;--a:#2a3bff;--b:#e63c7a;--c:#00a88f;--y:#f2b800;--line:#0e145033;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1250;--fg:#f4f5ff;--mut:#aab0f0;--a:#7f8cff;--b:#ff7aa8;--c:#3ce0c2;--y:#ffd21f;--line:#ffffff30}}
:root[data-theme="dark"]{--bg:#0c1250;--fg:#f4f5ff;--mut:#aab0f0;--a:#7f8cff;--b:#ff7aa8;--c:#3ce0c2;--y:#ffd21f;--line:#ffffff30}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--fg);font-family:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0}
#deck{position:relative;height:100%;z-index:1;perspective:1200px}
.slide{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:5vw;flex-wrap:wrap;padding:5vh 6vw 96px;visibility:hidden;overflow:hidden}
.slide.on,.slide.leaving{visibility:visible}
.slide.on{z-index:2}
.in{position:relative;z-index:1;width:100%;max-width:1040px;max-height:100%;overflow-y:auto;scrollbar-width:none}
.slide.cover .in,.slide.qr .in,.slide.end .in{width:auto;flex:1 1 320px}
.fl{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.sh{position:absolute;opacity:.2;border:3px solid var(--col)}
.s0{border-radius:50%}.s1{border-radius:14px}.s2{border-radius:50% 0 50% 0;background:var(--col);border:0}
h1,h2{margin:0;font-weight:800;letter-spacing:-.03em;line-height:1}
h1{font-size:clamp(3.2rem,13vw,8.5rem)}
h2{font-size:clamp(1.9rem,6vw,4rem);margin-bottom:1.2rem}
.l{display:inline-block;animation:wave 2.8s ease-in-out infinite;animation-delay:calc(var(--k)*.12s)}
@keyframes wave{50%{transform:translateY(-.09em);color:var(--y)}}
.lead{font-size:clamp(1.05rem,2.6vw,1.6rem);line-height:1.4;max-width:34em;color:var(--mut);margin:1rem 0 0}
h2+.lead{margin-top:0;color:var(--fg)}
.sub{margin-top:1.4rem;font-weight:700;color:var(--c)}
.r{opacity:0}
.slide.on .r{animation:rise .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*90ms + 250ms)}
.slide.leaving .r{opacity:1;animation:none}
@keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
.rows{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:1.3rem 2.4rem}
.row{border-left:6px solid var(--y);padding:.3rem 0 .3rem 1rem}
.row b{display:block;font-size:clamp(1.1rem,2.4vw,1.5rem);margin-bottom:.2rem}
.row span{color:var(--mut);font-size:clamp(.95rem,1.9vw,1.15rem);line-height:1.35}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:1.6rem}
.st i{display:grid;place-items:center;width:3rem;height:3rem;border-radius:50%;background:var(--a);color:#fff;font-style:normal;font-weight:800;font-size:1.3rem;margin-bottom:.7rem;animation:pulse 4s ease-out infinite;animation-delay:calc(var(--n)*1s)}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--y)}20%,100%{box-shadow:0 0 0 18px transparent}}
.st b{display:block;font-size:1.2rem;margin-bottom:.2rem}.st span{color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:.9rem}
.chip{display:inline-block;padding:.55rem 1.1rem;border:3px solid var(--col);border-radius:999px;font-weight:700;font-size:clamp(1rem,2.4vw,1.4rem);animation:bob 4s ease-in-out infinite}
.chips>div:nth-child(4n+1){--col:var(--a)}.chips>div:nth-child(4n+2){--col:var(--b)}.chips>div:nth-child(4n+3){--col:var(--c)}.chips>div:nth-child(4n){--col:var(--y)}
@keyframes bob{50%{transform:translateY(-9px) rotate(-1.5deg)}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:1.6rem}
.stat strong{display:block;font-size:clamp(3rem,10vw,6rem);line-height:1;color:var(--y);font-variant-numeric:tabular-nums}
.stat span{color:var(--mut);font-size:1.1rem}
.qr{position:relative;display:grid;grid-template-columns:repeat(13,1fr);gap:3px;width:min(62vw,300px);aspect-ratio:1;padding:12px;background:var(--bg);border:6px solid var(--fg);border-radius:16px;overflow:hidden;flex:0 0 auto}
.qr u{background:var(--fg);border-radius:2px;transition:opacity .35s}
.qr u.z{opacity:0}
.qr b{position:absolute;left:0;right:0;height:5px;background:var(--y);box-shadow:0 0 18px 4px var(--y);animation:scan 2.4s ease-in-out infinite alternate}
@keyframes scan{from{top:0}to{top:calc(100% - 5px)}}
.conn{margin:.2rem 0 1rem;font-weight:700;color:var(--c);font-size:clamp(.95rem,2vw,1.2rem)}
.slide.code h2{font-size:clamp(1.6rem,4.6vw,3rem);margin-bottom:.7rem}
.slide.code .lead{font-size:clamp(.95rem,2.1vw,1.25rem);margin:0 0 .5rem}
.tabs{display:flex;gap:.3rem;flex-wrap:wrap}
.tab{font:inherit;font-weight:700;padding:.45rem .9rem;border:2px solid var(--line);border-bottom:0;border-radius:10px 10px 0 0;background:transparent;color:var(--mut);cursor:pointer}
.tab.on{background:#0b1030;border-color:#0b1030;color:#fff}
.pane{display:none;margin:0;padding:1rem 1.1rem;background:#0b1030;color:#e8ebff;border-radius:0 12px 12px 12px;font:clamp(.72rem,1.9vw,.98rem)/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;overflow:auto;max-height:44vh;tab-size:2;white-space:pre}
.pane.on{display:block}
.pane i{font-style:normal}.pane .c{color:#8b93d6}.pane .s{color:#3ce0c2}.pane .k{color:#ff7aa8}.pane .n{color:#ffd21f}
#bar{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;align-items:center;gap:.6rem;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px))}
#prog{position:absolute;left:0;top:0;height:4px;width:100%;background:var(--y);transform-origin:0 50%;transform:scaleX(0);transition:transform .5s}
#cnt{margin-right:auto;font-weight:700;color:var(--mut);font-variant-numeric:tabular-nums}
#bar button{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:transparent;color:var(--fg);font:inherit;font-size:1.1rem;cursor:pointer}
#bar button:hover,#bar button:focus-visible{border-color:var(--y);outline:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.r{opacity:1!important}}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div id="deck"></div>
<div id="bar"><div id="prog"></div><span id="cnt"></span>
<button id="pv" aria-label="Anterior">◀</button><button id="nx" aria-label="Próximo">▶</button>
<button id="pl" aria-label="Reprodução automática">⏵</button><button id="th" aria-label="Tema">◐</button><button id="fs" aria-label="Tela cheia">⛶</button></div>
<script>
/* ============ EDITE AQUI ============
   Cada objeto é uma tela. Tipos: cover, text, rows, steps, chips, stats, qr, end
   h = título · p = texto · s = linha extra · items = lista
   rows/steps: "Título|Descrição"   chips: "Texto"   stats: "número|sufixo|legenda"
   fx (opcional, 0 a 5) = efeito de transição da tela. */
const SLIDES=[
{t:'cover',h:'UniChamada',p:'Presença por QR Code rotativo, GPS e câmera, com dados em tempo real.',s:'Adalberto e Diego, Análise e Desenvolvimento de Sistemas'},
{t:'rows',h:'Quem fez',items:['Adalberto|Curso de Análise e Desenvolvimento de Sistemas.','Diego|Curso de Análise e Desenvolvimento de Sistemas.','Projeto|Sistema de Gestão Acadêmica e Frequência Inteligente.','Código aberto|github.com/Adangomes/UNICHAMADA']},
{t:'text',h:'Fazer a chamada consome a aula',p:'Lista em papel, nomes chamados um a um, assinaturas por colegas ausentes. O tempo da aula vai embora e a presença ainda não é confiável.'},
{t:'text',h:'Uma chamada que se faz sozinha',p:'O professor projeta um QR Code. O aluno lê com o celular, confirma que está na sala e que é ele. A presença aparece na tela do professor na hora.'},
{t:'rows',h:'Três perfis de acesso',items:['Coordenador|Cuida de toda a parte administrativa.','Professor|Controla a chamada e o histórico das suas turmas.','Aluno|Confirma a própria presença com validações de segurança.','Rotas protegidas|Cada perfil só enxerga o que é dele.']},
{t:'rows',h:'Coordenador',items:['Cursos e disciplinas|Cadastro completo, com edição e exclusão.','Professores e alunos|O aluno tem foto cadastral.','Turmas|Ligam disciplina, professor e horário.','Matrículas|Colocam cada aluno na sua turma.']},
{t:'rows',h:'Professor',items:['Turmas atribuídas|Vê só as turmas que são dele.','Ciclo da chamada|Abre, acompanha e encerra.','Histórico de presenças|Pode ajustar um registro.','Justificativa de faltas|Toda alteração fica registrada.']},
{t:'rows',h:'Aluno',items:['Lê o QR ou digita o código|O código tem 6 caracteres.','Confirma o local|GPS dentro do raio permitido.','Confirma o rosto|Captura pela câmera do dispositivo.','Recebe o resultado|Presença registrada ou recusada.']},
{t:'steps',h:'Como funciona a chamada',items:['Professor abre a chamada|O sistema gera o primeiro token.','Telão mostra o QR|O código troca com o tempo.','Aluno valida|Token, local e rosto.','Painel atualiza|Presença aparece ao vivo.']},
{t:'qr',h:'Token rotativo',p:'Estilo TOTP: o QR Code e o código de 6 caracteres têm validade curta e são renovados. Uma foto do QR compartilhada com quem está fora da sala perde o valor.'},
{t:'code',h:'Código: token rotativo',p:'O código muda a cada 30 segundos. Quem tem o segredo da chamada calcula o mesmo código no mesmo instante.',w:'js/utils/codigo-rotativo.js e o QR Code do professor',tabs:[{n:'codigo-rotativo.js',c:`// gera o código de 6 caracteres da janela atual
function gerarCodigo(segredo, agora = Date.now()) {
  const janela = Math.floor(agora / 30000); // muda a cada 30 s
  return resumo(segredo + janela)           // resumo = hash
    .slice(0, 6)
    .toUpperCase();
}`},{n:'validar',c:`// aceita o código atual ou o anterior (folga de relógio)
function codigoValido(segredo, digitado) {
  const agora = Date.now();
  return [agora, agora - 30000]
    .some(t => gerarCodigo(segredo, t) === digitado);
}`}]},
{t:'code',h:'Código: Modo Telão',p:'Abre uma janela separada para projetar na sala e manda a ela o código atual a cada segundo.',w:'js/professor/telao.js e a section tela-telao do index.html',tabs:[{n:'telao.js',c:`// janela secundária para o projetor
const telao = window.open('#/telao', 'telao', 'width=1000,height=700');

setInterval(() => {
  telao.postMessage({ codigo: codigoAtual() }, location.origin);
}, 1000);`},{n:'index.html',c:`<section id="tela-telao" class="oculto"></section>`}]},
{t:'code',h:'Código: geofencing por GPS',p:'Pede a posição ao navegador e calcula a distância até a sala. Fora do raio, a presença é recusada.',w:'js/utils/geolocalizacao.js e a API Geolocation do navegador',tabs:[{n:'geolocalizacao.js',c:`const RAIO_MAX = 100; // metros de tolerância

navigator.geolocation.getCurrentPosition(pos => {
  const { latitude, longitude } = pos.coords;
  const metros = distancia(latitude, longitude, aula.lat, aula.lng);
  if (metros > RAIO_MAX) recusar('Fora do local da aula');
});`},{n:'distancia',c:`// fórmula de Haversine: distância entre dois pontos da Terra
function distancia(lat1, lng1, lat2, lng2) {
  const rad = g => g * Math.PI / 180;
  const a = Math.sin(rad(lat2 - lat1) / 2) ** 2 +
    Math.cos(rad(lat1)) * Math.cos(rad(lat2)) *
    Math.sin(rad(lng2 - lng1) / 2) ** 2;
  return 6371000 * 2 * Math.asin(Math.sqrt(a));
}`}]},
{t:'code',h:'Código: câmera e biometria',p:'Liga a câmera, tira uma foto do rosto e transforma em texto para poder guardar no banco. A validação facial em si ainda é simulada.',w:'js/utils/camera.js e a API MediaDevices do navegador',tabs:[{n:'camera.js',c:`const stream = await navigator.mediaDevices
  .getUserMedia({ video: true });
video.srcObject = stream;            // mostra a câmera ao vivo`},{n:'foto',c:`// congela um quadro e converte em imagem
canvas.getContext('2d').drawImage(video, 0, 0);
const foto = canvas.toDataURL('image/jpeg', 0.7);`}]},
{t:'code',h:'Código: confirmar presença',p:'O aluno passa por quatro etapas em ordem. Se qualquer uma falhar, a presença não é gravada.',w:'js/aluno/confirmar-presenca.js, que chama os outros módulos',tabs:[{n:'confirmar-presenca.js',c:`async function confirmar(codigo) {
  await validarCodigo(codigo);        // 1. token da chamada
  const pos  = await obterPosicao();  // 2. GPS
  const foto = await capturarRosto(); // 3. câmera
  await registrarPresenca({ codigo, pos, foto }); // 4. banco
}`}]},
{t:'code',h:'Código: painel em tempo real',p:'O painel do professor assina os novos registros da tabela. Quando o aluno confirma, o banco avisa e a lista atualiza.',w:'tabela presencas do Supabase (Realtime)',tabs:[{n:'chamada.js',c:`cliente
  .channel('presencas')
  .on('postgres_changes',
      { event: 'INSERT', schema: 'public', table: 'presencas' },
      payload => adicionarNaLista(payload.new))
  .subscribe();`}]},
{t:'text',h:'Auditoria',p:'Toda mudança de presença ou falta guarda uma justificativa. O professor consegue conferir o histórico e entender o que mudou.'},
{t:'text',h:'Integrações',p:'O UniChamada não tem servidor próprio. Ele junta serviços prontos e recursos do navegador, e cada peça cuida de uma parte da chamada.'},
{t:'rows',h:'Quem conversa com quem',items:['Navegador|Câmera, GPS e janela do telão.','Supabase|Banco, login e atualização ao vivo.','SDK supabase-js|Ponte entre o código e o Supabase.','GitHub Pages|Coloca o sistema no ar.']},
{t:'steps',h:'O caminho de uma presença',items:['Aluno lê o token|QR Code ou código de 6 caracteres.','Geolocalização|O navegador informa onde ele está.','Câmera|A foto é capturada para validação.','Banco|O dado é gravado no PostgreSQL.','Realtime|O painel do professor atualiza.']},
{t:'code',h:'Código: conexão com o Supabase',p:'A biblioteca entra pelo CDN e o db.js cria um único cliente. Todo o resto do sistema usa esse cliente.',w:'projeto Supabase, pela biblioteca supabase-js',tabs:[{n:'index.html',c:`<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"><\/script>
<script src="js/data/db.js"><\/script>`},{n:'db.js',c:`// único arquivo que fala com o Supabase
const { createClient } = supabase;
const cliente = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
// a chave anon é pública: quem protege os dados é o RLS`}]},
{t:'code',h:'Código: a tabela alunos',p:'Uma tabela no banco, uma função no db.js e uma tela que usa a função. É esse o caminho de todos os cadastros.',w:'tabela alunos (PostgreSQL), db.js e a tela alunos.js',tabs:[{n:'SQL',c:`create table alunos (
  id uuid primary key default gen_random_uuid(),
  ra text not null unique,
  nome text not null,
  email text,
  foto text, -- foto cadastral
  criado_em timestamptz default now()
);`},{n:'db.js',c:`async function listarAlunos() {
  const { data, error } = await cliente
    .from('alunos')
    .select('*')
    .order('nome');
  if (error) throw error;
  return data;
}`},{n:'alunos.js',c:`// tela do coordenador
const alunos = await listarAlunos();
alunos.forEach(a => tabela.append(criarLinha(a)));`}]},
{t:'code',h:'Código: tabelas que se ligam',p:'A matrícula guarda o id do aluno e o id da turma. Com chaves estrangeiras o banco liga os dados e impede registros soltos.',w:'tabelas matriculas, alunos e turmas',tabs:[{n:'SQL',c:`create table matriculas (
  id uuid primary key default gen_random_uuid(),
  aluno_id uuid references alunos(id),
  turma_id uuid references turmas(id)
);`},{n:'db.js',c:`// traz a matrícula junto com o nome do aluno e da turma
const { data } = await cliente
  .from('matriculas')
  .select('id, alunos(nome), turmas(nome)');`}]},
{t:'code',h:'Código: registrar a presença',p:'Cada confirmação vira uma linha na tabela presencas. É essa linha que o painel em tempo real recebe.',w:'tabela presencas (PostgreSQL)',tabs:[{n:'SQL',c:`create table presencas (
  id uuid primary key default gen_random_uuid(),
  chamada_id uuid references chamadas(id),
  aluno_id uuid references alunos(id),
  latitude double precision,
  longitude double precision,
  criado_em timestamptz default now()
);`},{n:'db.js',c:`async function registrarPresenca(dados) {
  const { error } = await cliente
    .from('presencas')
    .insert(dados);
  if (error) throw error;
}`}]},
{t:'code',h:'Código: login com Supabase Auth',p:'O Supabase confere a senha e devolve a sessão. O auth.js guarda quem está logado e o sistema protege as telas com isso.',w:'Supabase Auth e js/auth/auth.js',tabs:[{n:'auth.js',c:`const { data, error } = await cliente.auth
  .signInWithPassword({ email, password: senha });
if (error) return mostrarErro('Login inválido');`},{n:'sessão',c:`const { data } = await cliente.auth.getSession();
if (!data.session) mostrarTela('login'); // rota protegida`}]},
{t:'code',h:'Código: segurança no banco (RLS)',p:'As regras ficam dentro do PostgreSQL. Mesmo que alguém altere a tela, o banco só entrega o que a regra permite.',w:'políticas de Row Level Security do Supabase',tabs:[{n:'SQL',c:`alter table presencas enable row level security;

create policy "aluno vê só as suas presenças"
  on presencas for select
  using (aluno_id = auth.uid());`}]},
{t:'rows',h:'APIs do navegador',items:['Geolocation|Posição do aluno para o geofencing.','MediaDevices|Câmera, através do camera.js.','window.open|Janela do modo Telão.','postMessage|Conversa entre o painel e o telão.']},
{t:'code',h:'Código: publicar no GitHub Pages',p:'O sistema é estático. Um push no repositório publica a nova versão, sem servidor e sem etapa de build.',w:'repositório Adangomes/UNICHAMADA no GitHub',tabs:[{n:'terminal',c:`git add .
git commit -m "atualiza o sistema"
git push origin main   # o GitHub Pages publica sozinho`}]},
{t:'rows',h:'Organização do projeto',items:['index.html|Ponto de entrada da aplicação de página única.','css|Base visual, login, painéis, chamada e telão.','js/data e js/auth|Banco (db.js) e sessão (auth.js).','js/coordenador, professor, aluno|Um conjunto de módulos por perfil.']},
{t:'chips',h:'Tecnologias',items:['HTML5','CSS3','JavaScript','SQL','Supabase','PostgreSQL','Realtime','Supabase Auth','supabase-js','GitHub Pages','Geolocation API','MediaDevices','Git']},
{t:'text',h:'Do localStorage ao Supabase',p:'O projeto começou simulando tabelas relacionais no localStorage. Hoje roda em banco Supabase de verdade, com dados persistentes e presença em tempo real.'},
{t:'rows',h:'Contra fraude',items:['Token com validade|Não adianta repassar o QR.','GPS|O aluno precisa estar no local.','Biometria facial|Confirma quem está na chamada.','Auditoria|Ajustes ficam registrados com justificativa.']},
{t:'stats',h:'Em números',items:['3||perfis de acesso','6||módulos de gestão do coordenador','93||commits no repositório','0||frameworks no front-end']},
{t:'rows',h:'A importância de cada linguagem',items:['HTML|Monta a estrutura das telas: formulários, tabelas, botões e o telão.','CSS|Deixa o sistema legível e responsivo, no celular do aluno e no projetor.','JavaScript|É a lógica: token, GPS, câmera, login e conversa com o banco.','SQL|Cria as tabelas, liga os dados e define as regras de segurança.']},
{t:'rows',h:'A importância de cada ferramenta',items:['Supabase|Entrega banco, login e tempo real sem servidor próprio.','supabase-js|Deixa o código falar com o banco de forma simples.','GitHub Pages|Publica de graça e a cada push.','Git|Guarda a história do projeto e permite trabalhar em dupla.']},
{t:'text',h:'Demonstração',p:'Hora de abrir o sistema: o professor inicia a chamada, projeta o telão, o aluno confirma e a presença aparece ao vivo.'},
{t:'rows',h:'Próximos passos',items:['Reconhecimento facial real|Trocar a simulação por um motor de verdade.','Relatórios completos|Filtros por período e turma.','Avisos de faltas|Alertas para alunos e professores.','Testes automatizados|A camada db.js já ajuda nisso.']},
{t:'end',h:'Obrigado!',p:'Perguntas?',s:'Adalberto e Diego, Análise e Desenvolvimento de Sistemas'}
];
/* ============ MOTOR (não precisa mexer) ============ */
const $=s=>document.querySelector(s),deck=$('#deck'),RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const E=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const letters=h=>[...h].map((c,k)=>`<span class="l" style="--k:${k}">${c===' '?'&nbsp;':E(c)}</span>`).join('');
const qr=(i)=>{let h=`<div class="qr r" style="--i:${i}">`;for(let k=0;k<169;k++)h+='<u></u>';return h+'<b></b></div>'};
const hl=c=>E(c).replace(/(\/\/.*|--.*)|("[^"\n]*"|'[^'\n]*'|`[^`\n]*`)|\b(const|let|function|async|await|return|if|else|new|from|select|insert|update|delete|create|table|primary|key|references|into|values|where|null|not|unique|default|policy|alter|enable|using|on|for|true|false|as)\b|\b(\d+)\b/g,(m,a,b,k,d)=>a?`<i class="c">${a}</i>`:b?`<i class="s">${b}</i>`:k?`<i class="k">${k}</i>`:`<i class="n">${d}</i>`);
function body(s){let i=0;const r=(tag,cls,html)=>`<${tag} class="r ${cls||''}" style="--i:${i++}">${html}</${tag}>`;
const sp=x=>x.split('|');let m='',side='';
if(s.t==='cover'||s.t==='end'){m=r('h1','',letters(s.h))+r('p','lead',E(s.p))+(s.s?r('p','sub',E(s.s)):'');side=qr(3)}
else if(s.t==='qr'){m=r('h2','',E(s.h))+r('p','lead',E(s.p));side=qr(2)}
else if(s.t==='code'){m=r('h2','',E(s.h))+r('p','lead',E(s.p))+r('p','conn','Conecta com: '+E(s.w))+
 r('div','codebox','<div class="tabs">'+s.tabs.map((t,k)=>`<button class="tab${k?'':' on'}" data-k="${k}">${E(t.n)}</button>`).join('')+'</div>'+s.tabs.map((t,k)=>`<pre class="pane${k?'':' on'}"><code>${hl(t.c)}</code></pre>`).join(''))}
else{m=r('h2','',E(s.h));
 if(s.t==='text')m+=r('p','lead',E(s.p));
 if(s.t==='rows')m+='<div class="rows">'+s.items.map(x=>{const[a,b]=sp(x);return r('div','row',`<b>${E(a)}</b><span>${E(b||'')}</span>`)}).join('')+'</div>';
 if(s.t==='steps')m+='<div class="steps">'+s.items.map((x,k)=>{const[a,b]=sp(x);return r('div','st',`<i style="--n:${k}">${k+1}</i><b>${E(a)}</b><span>${E(b||'')}</span>`)}).join('')+'</div>';
 if(s.t==='chips')m+='<div class="chips">'+s.items.map((x,k)=>r('div','',`<span class="chip" style="animation-delay:${-k*.7}s">${E(x)}</span>`)).join('')+'</div>';
 if(s.t==='stats')m+='<div class="stats">'+s.items.map(x=>{const[n,su,l]=sp(x);return r('div','stat',`<strong data-n="${+n}" data-s="${E(su)}">0</strong><span>${E(l)}</span>`)}).join('')+'</div>'}
return `<div class="in">${m}</div>${side}`}
function shapes(el){const w=document.createElement('div');w.className='fl';
for(let i=0;i<7;i++){const s=document.createElement('i'),z=30+Math.random()*90;s.className='sh s'+i%3;
s.style.cssText=`width:${z}px;height:${z}px;left:${Math.random()*100}%;top:${Math.random()*100}%;--col:var(--${'abcy'[i%4]})`;w.appendChild(s);
if(!RM)s.animate([{transform:'none'},{transform:`translate(${(Math.random()-.5)*140}px,${(Math.random()-.5)*140}px) rotate(${Math.random()*360}deg)`}],{duration:6000+Math.random()*8000,direction:'alternate',iterations:Infinity,easing:'ease-in-out'})}
el.prepend(w)}
const els=SLIDES.map(s=>{const e=document.createElement('section');e.className='slide '+s.t;e.innerHTML=body(s);shapes(e);deck.appendChild(e);return e});
/* transições */
const FX=[
d=>({i:[{opacity:0,transform:`translateX(${9*d}%) scale(.96)`},{opacity:1,transform:'none'}],o:[{opacity:1},{opacity:0,transform:`translateX(${-9*d}%) scale(.96)`}]}),
d=>({i:[{opacity:0,transform:'scale(.8)',filter:'blur(14px)'},{opacity:1,transform:'none',filter:'blur(0)'}],o:[{opacity:1},{opacity:0,transform:'scale(1.2)',filter:'blur(14px)'}]}),
d=>({i:[{opacity:0,transform:`rotateY(${-70*d}deg)`},{opacity:1,transform:'none'}],o:[{opacity:1},{opacity:0,transform:`rotateY(${70*d}deg)`}]}),
d=>({i:[{opacity:0,transform:`translateY(${14*d}%)`},{opacity:1,transform:'none'}],o:[{opacity:1},{opacity:0,transform:`translateY(${-14*d}%)`}]}),
d=>({i:[{opacity:0,transform:`rotate(${-7*d}deg) scale(.88)`},{opacity:1,transform:'none'}],o:[{opacity:1},{opacity:0,transform:`rotate(${7*d}deg) scale(.88)`}]}),
d=>({i:[{clipPath:'circle(0% at 50% 50%)'},{clipPath:'circle(80% at 50% 50%)'}],o:[{opacity:1},{opacity:0}]})];
let n=-1,busy=false,kick=0,timer=null;
function count(el){el.querySelectorAll('[data-n]').forEach(c=>{const t=+c.dataset.n,s=c.dataset.s,t0=performance.now();
const f=now=>{const p=Math.min(1,(now-t0)/1400);c.textContent=Math.round(t*(1-Math.pow(1-p,3)))+s;if(p<1)requestAnimationFrame(f)};requestAnimationFrame(f)})}
function go(to,first){to=Math.max(0,Math.min(SLIDES.length-1,to));if(to===n||busy)return;
const d=to>n?1:-1,b=els[to],a=els[n];busy=true;setTimeout(()=>busy=false,first?0:600);
b.classList.add('on');
if(a){a.classList.remove('on');a.classList.add('leaving')}
if(!first&&!RM){const f=FX[(SLIDES[to].fx??to)%FX.length](d);
 b.animate(f.i,{duration:850,easing:'cubic-bezier(.2,.8,.2,1)',fill:'backwards'});
 if(a){const an=a.animate(f.o,{duration:600,easing:'ease-in',fill:'forwards'});an.onfinish=()=>{an.cancel();a.classList.remove('leaving')}}}
else if(a)a.classList.remove('leaving');
kick=d*7;n=to;count(b);
$('#cnt').textContent=`${n+1} / ${SLIDES.length}`;$('#prog').style.transform=`scaleX(${(n+1)/SLIDES.length})`;history.replaceState(null,'','#'+(n+1))}
const next=()=>go(n+1),prev=()=>go(n-1);
$('#nx').onclick=next;$('#pv').onclick=prev;
$('#pl').onclick=()=>{if(timer){clearInterval(timer);timer=null;$('#pl').textContent='⏵'}else{timer=setInterval(()=>n>=SLIDES.length-1?go(0):next(),6500);$('#pl').textContent='⏸'}};
$('#th').onclick=()=>{const r=document.documentElement,dark=getComputedStyle(r).getPropertyValue('--bg').trim()==='#0c1250';r.dataset.theme=dark?'light':'dark';cols()};
$('#fs').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();
addEventListener('keydown',e=>{const k=e.key;if(['ArrowRight','ArrowDown','PageDown',' '].includes(k)){e.preventDefault();next()}else if(['ArrowLeft','ArrowUp','PageUp'].includes(k))prev();else if(k==='Home')go(0);else if(k==='End')go(SLIDES.length-1);else if(k==='f')$('#fs').click()});
let tx=0,ty=0,sk=false;addEventListener('touchstart',e=>{sk=!!e.target.closest('pre');tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
addEventListener('touchend',e=>{if(sk)return;const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy))dx<0?next():prev()},{passive:true});
document.addEventListener('click',e=>{const t=e.target.closest('.tab');if(!t)return;const b=t.closest('.codebox');
b.querySelectorAll('.tab,.pane').forEach(x=>x.classList.remove('on'));t.classList.add('on');b.querySelectorAll('.pane')[t.dataset.k].classList.add('on')});
/* QR animado */
const cells=[...document.querySelectorAll('.qr')].map(q=>[...q.children].filter(u=>u.tagName==='U'));
cells.forEach(c=>c.forEach((u,k)=>{const r=Math.floor(k/13),co=k%13;if((r<3&&(co<3||co>9))||(r>9&&co<3))return;if(Math.random()<.5)u.classList.add('z');u.dyn=1}));
if(!RM)setInterval(()=>cells.forEach(c=>{for(let j=0;j<7;j++){const u=c[Math.floor(Math.random()*169)];if(u.dyn)u.classList.toggle('z')}}),260);
/* fundo: rede de partículas */
const cv=$('#bg'),cx=cv.getContext('2d');let W,H,P=[],col=['#fff','#fff'];
const cs=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
function cols(){col=[cs('--a'),cs('--c')]}
function rs(){const r=devicePixelRatio||1;W=cv.width=innerWidth*r;H=cv.height=innerHeight*r;
P=Array.from({length:Math.round(innerWidth*innerHeight/15000)+18},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.7*r,vy:(Math.random()-.5)*.7*r,s:(Math.random()*2+1.5)*r}))}
function draw(){cx.clearRect(0,0,W,H);const r=devicePixelRatio||1,L=140*r;kick*=.95;
for(const p of P){p.x+=p.vx+kick*r*.4;p.y+=p.vy;if(p.x<0)p.x=W;if(p.x>W)p.x=0;if(p.y<0)p.y=H;if(p.y>H)p.y=0}
cx.lineWidth=r;for(let i=0;i<P.length;i++){const p=P[i];for(let j=i+1;j<P.length;j++){const q=P[j],dx=p.x-q.x,dy=p.y-q.y,dd=Math.hypot(dx,dy);
if(dd<L){cx.globalAlpha=(1-dd/L)*.35;cx.strokeStyle=col[0];cx.beginPath();cx.moveTo(p.x,p.y);cx.lineTo(q.x,q.y);cx.stroke()}}
cx.globalAlpha=.7;cx.fillStyle=col[i%2];cx.beginPath();cx.arc(p.x,p.y,p.s,0,7);cx.fill()}
if(!RM)requestAnimationFrame(draw)}
addEventListener('resize',()=>{rs();if(RM)draw()});matchMedia('(prefers-color-scheme: dark)').addEventListener('change',cols);
cols();rs();draw();
go(Math.max(0,(parseInt(location.hash.slice(1))||1)-1),true);
</script>
</body>
</html>
