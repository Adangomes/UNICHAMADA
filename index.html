<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistema Acadêmico</title>
  <!-- Estilos CSS -->
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/login.css" />
  <link rel="stylesheet" href="css/painel.css" />
  <link rel="stylesheet" href="css/chamada.css" />
  <link rel="stylesheet" href="css/confirmar-presenca.css" />
  <link rel="stylesheet" href="css/telao.css" />
  <link rel="stylesheet" href="css/notificacao.css" />
  <link rel="stylesheet" href="css/chat/coordenador.css" />
  <link rel="stylesheet" href="css/chat/professor.css" />
  <link rel="stylesheet" href="css/chat/config/menu-contexto.css" />
  <link rel="stylesheet" href="css/chat/config/editar_msg.css" />
  <link rel="stylesheet" href="css/chat/config/excluir.css" />
  <link rel="stylesheet" href="css/chat/config/emojis.css" />
  <link rel="stylesheet" href="css/chat/config/fotos-e-arquivos.css" />
  <link rel="stylesheet" href="css/relatorios/relatorios.css" />
  <link rel="stylesheet" href="css/chamy/chamy.css" />
  

  <!-- Bibliotecas Externas -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="icon" href="data:;base64,iVBORw0KGgo=">
</head>
<body>
  <!-- ================= SEÇÕES DAS TELAS (SPA) ================= -->
  <!-- A tela de login agora é injetada dinamicamente via js/login/login.js -->
  <section id="tela-login"></section>
  <!-- ================= TELA DO COORDENADOR ================= -->
  <section id="tela-coordenador" class="painel oculto"></section>
  <!-- ================= TELA DO PROFESSOR ================= -->
  <section id="tela-professor" class="painel oculto"></section>
  <!-- ================= TELA DE CONFIRMAÇÃO DE PRESENÇA (aluno via QR Code) ================= -->
  <section id="tela-confirmar-presenca" class="oculto"></section>
  <!-- ================= TELÃO (janela separada, para projetar) ================= -->
  <section id="tela-telao" class="oculto"></section>

  <!-- ================= SCRIPTS (ordem importa: dados > utils > auth/login > chat > telas > main) ================= -->
  <!-- Camada de Dados -->
  <script src="js/data/db.js"></script>

  <!-- Utilitários -->
  <script src="js/utils/helpers.js"></script>
  <script src="js/utils/camera.js"></script>
  <script src="js/utils/cabecalho.js"></script>
  <script src="js/utils/geolocalizacao.js"></script>
  <script src="js/utils/reconhecimento-facial.js"></script>
  <script src="js/utils/codigo-rotativo.js"></script>

  <!-- Autenticação & Módulo de Login -->
  <script src="js/login/login.js"></script>
  <script src="js/auth/auth.js"></script>

  <!-- Chat: criptografia (antes do data/chat.js) -->
  <script src="js/chat/cripto/criptografia.js"></script>

  <!-- Chat: camada de dados (depende do db.js) -->
  <script src="js/data/chat.js"></script>

  <!-- Chat: recursos extras (config/) -->
  <script src="js/coordenador/chat/config/menu-contexto.js"></script>
  <script src="js/coordenador/chat/config/editar_msg.js"></script>
  <script src="js/coordenador/chat/config/excluir.js"></script>
  <script src="js/coordenador/chat/config/emojis.js"></script>
  <script src="js/coordenador/chat/config/fotos-e-arquivos.js"></script>
  <script src="js/professor/chat/config/menu-contexto.js"></script>
  <script src="js/professor/chat/config/editar_msg.js"></script>
  <script src="js/professor/chat/config/excluir.js"></script>
  <script src="js/professor/chat/config/emojis.js"></script>
  <script src="js/professor/chat/config/fotos-e-arquivos.js"></script>

  <!-- Chat: telas (precisam vir depois do data/chat.js e do config/) -->
  <script src="js/coordenador/chat/chat.js"></script>
  <script src="js/professor/chat/chat.js"></script>

   <!-- Relatórios (dashboard dos painéis) -->
  <script src="js/relatorios/globo.js"></script>
  <script src="js/relatorios/relatorios.js"></script>

  <!-- CHAMY (robo) -->
  <script src="js/professor/chamy/chamy.js"></script>

  <!-- Módulos do Coordenador -->
  <script src="js/coordenador/cursos.js"></script>
  <script src="js/coordenador/professores.js"></script>
  <script src="js/coordenador/alunos.js"></script>
  <script src="js/coordenador/disciplinas.js"></script>
  <script src="js/coordenador/turmas.js"></script>
  <script src="js/coordenador/matriculas.js"></script>
  <script src="js/coordenador/coordenador.js"></script>
  <script src="js/coordenador/notificacao.js"></script>

  <!-- Módulos do Professor -->
  <script src="js/professor/chamada.js"></script>
  <script src="js/professor/historico.js"></script>
  <script src="js/professor/telao.js"></script>
  <script src="js/professor/professor.js"></script>
  <script src="js/professor/notificacao.js"></script>

  <!-- Módulos do Aluno -->
  <script src="js/aluno/confirmar-presenca.js"></script>

  <!-- Main (Orquestrador) -->
  <script src="js/main.js"></script>
</body>
</html>
